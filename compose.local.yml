services:
  db:
    image: postgres:17
    container_name: tpa-layernote-local-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: tpa_local_layernote
      POSTGRES_USER: tpa_local
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_PASSWORD:?Run npm run local:setup first}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - tpa_layernote_local_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tpa_local -d tpa_local_layernote"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  tpa_layernote_local_data:
